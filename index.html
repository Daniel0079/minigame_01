<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搞怪小遊戲集合</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin: 10px 0; font-size: 2rem; text-shadow: 0 0 10px #ff6b6b; }
  .menu {
    display: flex;
    gap: 12px;
    margin: 15px 0 25px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .menu button {
    padding: 12px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    background: #ff6b6b;
    color: white;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(255,107,107,0.4);
  }
  .menu button:hover { transform: translateY(-3px); background: #ff5252; }
  .menu button.active { background: #4ecdc4; box-shadow: 0 4px 15px rgba(78,205,196,0.5); }
  .game-container {
    width: 100%;
    max-width: 600px;
    min-height: 420px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 25px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .game { display: none; text-align: center; }
  .game.active { display: block; }

  /* Game 1: 逃跑按鈕 */
  #flee-btn {
    position: absolute;
    padding: 18px 30px;
    font-size: 1.3rem;
    background: #ffd93d;
    color: #333;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    transition: left 0.08s, top 0.08s;
  }
  #flee-btn.hit {
    animation: hitPulse 0.4s ease-out;
  }
  @keyframes hitPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.4) rotate(10deg); filter: brightness(1.5); }
    100% { transform: scale(1); }
  }

  /* 點中粒子效果 */
  .hit-particle {
    position: absolute;
    pointer-events: none;
    font-size: 1.5rem;
    animation: particleFly 0.6s ease-out forwards;
    z-index: 10;
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0.3); opacity: 0; }
  }
  #score1 { font-size: 1.4rem; margin-bottom: 15px; }

  /* Game 2: 搞怪點擊 */
  #silly-btn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: none;
    font-size: 1.4rem;
    font-weight: bold;
    color: white;
    cursor: pointer;
    margin: 20px auto;
    display: block;
    transition: transform 0.1s, background 0.2s;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  }
  #silly-btn:active { transform: scale(0.92); }
  #silly-msg {
    font-size: 1.3rem;
    min-height: 60px;
    margin-top: 15px;
    color: #ffe66d;
    font-weight: bold;
  }
  #click-count { font-size: 1.1rem; opacity: 0.8; }

  /* Game 3: 接水果 */
  #catch-area {
    width: 100%;
    height: 320px;
    background: #0f3460;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    margin-top: 10px;
  }
  .falling {
    position: absolute;
    font-size: 2.2rem;
    user-select: none;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .falling:hover { transform: scale(1.2); }
  #catch-score { font-size: 1.3rem; margin-bottom: 8px; }
  .instructions { font-size: 0.95rem; opacity: 0.85; margin-bottom: 12px; }

  /* 炸彈爆炸效果 */
  .explosion {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff6b6b 0%, #ff9f43 40%, transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 1;
    animation: explode 0.5s ease-out forwards;
    z-index: 20;
  }
  @keyframes explode {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }
  .explosion-text {
    position: absolute;
    font-size: 2rem;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: explodeText 0.6s ease-out forwards;
    z-index: 21;
  }
  @keyframes explodeText {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -80%) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>🤪 搞怪小遊戲集合</h1>
  <div class="menu">
    <button onclick="switchGame(3)" class="active" id="btn3">接奇怪的東西</button>
    <button onclick="switchGame(1)" id="btn1">逃跑按鈕</button>
    <button onclick="switchGame(2)" id="btn2">搞怪點擊</button>
  </div>

  <div class="game-container">
    <!-- Game 1 -->
    <div id="game1" class="game">
      <div id="score1">成功點到次數：0</div>
      <div class="instructions">試著點中那個黃色按鈕（它會逃）</div>
      <button id="flee-btn" onmouseenter="flee()" ontouchstart="flee(event)" onclick="caught()">點我啊！</button>
    </div>

    <!-- Game 2 -->
    <div id="game2" class="game">
      <div id="click-count">已點擊：0 次</div>
      <button id="silly-btn" onclick="sillyClick()">點我看看</button>
      <div id="silly-msg">準備好被搞怪了嗎？</div>
    </div>

    <!-- Game 3 -->
    <div id="game3" class="game active">
      <div id="catch-score">分數：0　漏接：0 / 5</div>
      <div class="instructions" id="catch-instructions">點「開始」後，點擊掉下來的物品得分！炸彈點了算漏接，不點會給分。</div>
      <div id="catch-area" style="position:relative;">
        <button id="start-catch" onclick="startCatchGame()" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:14px 32px;font-size:1.3rem;background:#4ecdc4;color:#fff;border:none;border-radius:30px;cursor:pointer;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,0.3);">開始遊戲</button>
      </div>
    </div>
  </div>

<script>
// ===== 音效系統（Web Audio API，無需外部檔案） =====
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq = 440, duration = 0.1, type = 'sine', volume = 0.3) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}

function playFlee() {
  // 逃跑：快速下滑音
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(800, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.15);
}

function playCaught() {
  // 點中成功：上升音階
  playTone(523, 0.1, 'sine', 0.3);
  setTimeout(() => playTone(659, 0.1, 'sine', 0.3), 80);
  setTimeout(() => playTone(784, 0.15, 'sine', 0.35), 160);
}

function playSilly() {
  // 搞怪點擊：隨機音高
  const freqs = [220, 330, 440, 550, 660, 880];
  playTone(freqs[Math.floor(Math.random() * freqs.length)], 0.12, 'triangle', 0.25);
}

function playCatch() {
  // 接住：輕快 pop
  playTone(600, 0.08, 'sine', 0.3);
  setTimeout(() => playTone(900, 0.06, 'sine', 0.2), 40);
}

function playBomb() {
  // 炸彈：低沉爆炸
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(120, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.3);
}

// ===== 切換遊戲 =====
function switchGame(n) {
  document.querySelectorAll('.game').forEach(g => g.classList.remove('active'));
  document.querySelectorAll('.menu button').forEach(b => b.classList.remove('active'));
  document.getElementById('game' + n).classList.add('active');
  document.getElementById('btn' + n).classList.add('active');
  if (n === 3) {
    // 切到第三個遊戲時不自動開始，等玩家按開始
    stopFalling();
    resetCatchUI();
  } else stopFalling();
}

// ===== Game 1: 逃跑按鈕 =====
let score1 = 0;
function flee(e) {
  if (e && e.type === 'touchstart') {
    e.preventDefault(); // 防止手機上同時觸發 click
  }
  playFlee();
  const btn = document.getElementById('flee-btn');
  const container = btn.parentElement;
  const maxX = container.clientWidth - btn.offsetWidth - 20;
  const maxY = container.clientHeight - btn.offsetHeight - 40;
  const x = Math.random() * maxX;
  const y = 60 + Math.random() * (maxY - 60);
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';
}
function caught() {
  playCaught();
  score1++;
  document.getElementById('score1').textContent = '成功點到次數：' + score1;
  const msgs = ['哇靠你點到了！', '居然被你抓到...', '好準！', '再來一次啊！', '手速可以啊'];
  const btn = document.getElementById('flee-btn');
  btn.textContent = msgs[Math.floor(Math.random() * msgs.length)];

  // 點中動畫
  btn.classList.add('hit');
  setTimeout(() => btn.classList.remove('hit'), 400);
  spawnParticles(btn);

  // 點中後立刻再跑開
  setTimeout(() => {
    flee();
    btn.textContent = '點我啊！';
  }, 80);
}

function spawnParticles(el) {
  const rect = el.getBoundingClientRect();
  const container = el.parentElement;
  const particles = ['✨', '⭐', '💥', '🎉', '💛'];
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'hit-particle';
    p.textContent = particles[Math.floor(Math.random() * particles.length)];
    const angle = (Math.PI * 2 * i) / 6;
    const dist = 40 + Math.random() * 40;
    p.style.left = (rect.left - container.getBoundingClientRect().left + rect.width / 2 - 10) + 'px';
    p.style.top = (rect.top - container.getBoundingClientRect().top + rect.height / 2 - 10) + 'px';
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    container.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }
}

// ===== Game 2: 搞怪點擊 =====
let clickCount = 0;
const sillyMsgs = [
  '你是不是很閒？',
  '點下去了就回不去了',
  '今天也要當廢柴嗎？',
  '哇！你點了！恭喜你浪費時間',
  '再點一次看看會不會變聰明',
  '系統偵測到你很無聊',
  '這按鈕沒有任何用處，但你還是點了',
  '你的手指是不是很空虛？',
  '恭喜獲得「最閒的人」稱號',
  '點完有比較快樂嗎？',
  '再點下去可能會解鎖秘密（並沒有）',
  '你確定你不是機器人嗎？'
];
const colors = ['#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7','#dfe6e9','#fd79a8','#a29bfe','#fab1a0','#00cec9'];

function sillyClick() {
  playSilly();
  clickCount++;
  document.getElementById('click-count').textContent = '已點擊：' + clickCount + ' 次';
  const btn = document.getElementById('silly-btn');
  const msg = sillyMsgs[Math.floor(Math.random() * sillyMsgs.length)];
  document.getElementById('silly-msg').textContent = msg;
  btn.style.background = colors[Math.floor(Math.random() * colors.length)];
  btn.style.transform = `scale(${0.85 + Math.random() * 0.3}) rotate(${Math.random()*20-10}deg)`;
  setTimeout(() => btn.style.transform = 'scale(1)', 150);
}

// ===== Game 3: 接奇怪的東西 =====
let score3 = 0;
let misses = 0;
let fallInterval = null;
let gameOver = false;
const MAX_MISSES = 5;
const items = ['🍌','🍎','🍩','🍕','🦄','🐸','💩','⭐','💣','👻','🐱','🌮'];

function resetCatchUI() {
  score3 = 0;
  misses = 0;
  gameOver = false;
  document.getElementById('catch-score').textContent = '分數：0　漏接：0 / 5';
  document.getElementById('catch-instructions').textContent = '點「開始」後，點擊掉下來的物品得分！炸彈點了算漏接，不點會給分。';
  const area = document.getElementById('catch-area');
  if (area) {
    // 只清掉掉落物，保留開始按鈕
    Array.from(area.children).forEach(child => {
      if (child.id !== 'start-catch') child.remove();
    });
  }
  const startBtn = document.getElementById('start-catch');
  if (startBtn) {
    startBtn.style.display = 'block';
    startBtn.textContent = '開始遊戲';
  }
}

function startCatchGame() {
  if (gameOver) return;
  resetCatchUI();
  gameOver = false;
  document.getElementById('start-catch').style.display = 'none';
  document.getElementById('catch-instructions').textContent = '點擊掉下來的物品！炸彈💣點了算漏接，不點會給分。';
  startFalling();
}

function startFalling() {
  if (fallInterval) return;
  fallInterval = setInterval(spawnItem, 700);
}

function stopFalling() {
  if (fallInterval) {
    clearInterval(fallInterval);
    fallInterval = null;
  }
}

function endGame(byBomb = false) {
  gameOver = true;
  stopFalling();
  // 清掉還在掉的物品（保留開始按鈕）
  const area = document.getElementById('catch-area');
  if (area) {
    Array.from(area.children).forEach(child => {
      if (child.id !== 'start-catch') child.remove();
    });
  }
  let msg = '遊戲結束！分數：' + score3 + '　漏接滿 5 次';
  if (byBomb) {
    const taunts = [
      '手滑點到炸彈了嗎？',
      '炸彈看起來很誘人？',
      '下次記得躲一下喔',
      '點炸彈的感覺如何？',
      '炸彈：謝謝你點我'
    ];
    msg = '遊戲結束！分數：' + score3 + '<br>' + taunts[Math.floor(Math.random() * taunts.length)];
  }
  document.getElementById('catch-score').innerHTML = msg;
  document.getElementById('catch-instructions').textContent = '再玩一次？';
  const startBtn = document.getElementById('start-catch');
  if (startBtn) {
    startBtn.style.display = 'block';
    startBtn.textContent = '再玩一次';
  }
}

function getSpeed() {
  // 分數越高，快速的機率越高
  const fastChance = Math.min(0.8, 0.2 + score3 * 0.05);
  if (Math.random() < fastChance) {
    return 4 + Math.random() * 4;   // 快速 4~8
  } else {
    return 1.5 + Math.random() * 2.5; // 慢速 1.5~4
  }
}

function spawnItem() {
  if (gameOver) return;
  const area = document.getElementById('catch-area');
  if (!area) return;

  const el = document.createElement('div');
  el.className = 'falling';
  const item = items[Math.floor(Math.random() * items.length)];
  el.textContent = item;
  el.style.left = Math.random() * (area.clientWidth - 50) + 'px';
  el.style.top = '-40px';
  area.appendChild(el);

  let top = -40;
  const speed = getSpeed();
  const isBomb = item === '💣';
  let clicked = false;

  const timer = setInterval(() => {
    if (gameOver) {
      clearInterval(timer);
      el.remove();
      return;
    }
    top += speed;
    el.style.top = top + 'px';
    if (top > area.clientHeight) {
      clearInterval(timer);
      el.remove();
      // 掉出畫面
      if (!clicked) {
        if (isBomb) {
          // 不點炸彈 = 給分，不算漏接
          score3 += 1;
          playCatch();
          updateCatchScore('避開炸彈 +1');
        } else {
          // 普通物品漏接
          misses++;
          updateCatchScore('漏接！');
          if (misses >= MAX_MISSES) {
            endGame();
          }
        }
      }
    }
  }, 30);

  el.onclick = () => {
    if (clicked || gameOver) return;
    clicked = true;
    clearInterval(timer);
    // 點中動畫
    el.style.transition = 'transform 0.2s, opacity 0.2s';
    el.style.transform = 'scale(1.8)';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 200);

    if (isBomb) {
      // 點炸彈 = 算漏接
      playBomb();
      misses++;
      updateCatchScore('💥 點到炸彈！漏接');
      if (misses >= MAX_MISSES) {
        endGame();
      }
    } else {
      // 點普通物品 = 得分
      playCatch();
      score3++;
      updateCatchScore('接住了！');
    }
  };
}

function createExplosion(el, area) {
  const rect = el.getBoundingClientRect();
  const areaRect = area.getBoundingClientRect();
  const x = rect.left - areaRect.left + rect.width / 2;
  const y = rect.top - areaRect.top + rect.height / 2;

  // 爆炸圓形
  const exp = document.createElement('div');
  exp.className = 'explosion';
  exp.style.left = x + 'px';
  exp.style.top = y + 'px';
  area.appendChild(exp);

  // 爆炸文字
  const txt = document.createElement('div');
  txt.className = 'explosion-text';
  txt.textContent = '💥';
  txt.style.left = x + 'px';
  txt.style.top = y + 'px';
  area.appendChild(txt);

  setTimeout(() => {
    exp.remove();
    txt.remove();
  }, 600);
}

function updateCatchScore(msg) {
  document.getElementById('catch-score').textContent = '分數：' + score3 + '　漏接：' + misses + ' / 5　' + msg;
}

// 初始化逃跑按鈕位置
window.onload = () => {
  const btn = document.getElementById('flee-btn');
  btn.style.left = '40%';
  btn.style.top = '140px';
};
</script>
</body>
</html>
